apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: data-processor
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /var/log/analytics
              name: analytics-storage
      volumes:
        - name: analytics-storage
          persistentVolumeClaim:
            claimName: analytics-pvc-claim
